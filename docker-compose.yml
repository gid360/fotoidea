services:
  db:
    image: postgres:17-alpine
    container_name: fotoidea-crm-db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: fotoidea
      POSTGRES_PASSWORD: fotoidea_db_secret_pass_2026
      POSTGRES_DB: fotoidea
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    networks:
      - crm-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fotoidea-crm-app
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    networks:
      - crm-net
    depends_on:
      - db

networks:
  crm-net:
    external: true
